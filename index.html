<html lang="ja">
<head>

    <style>

            background-color: #f5f5f5;

            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 40px;
            font-size: 32px;
            color: #333;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu a {
            display: block;
            padding: 18px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu a:hover {
            background-color: #0056b3;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
